<svg width="600" height="400" xmlns="http://www.w3.org/2000/svg" style="background:#f9f9ff;border:1px solid #ddd;border-radius:8px;padding:20px;">
  <style>
    .layer { font: bold 14px sans-serif; fill: #333; text-anchor: middle; }
    .arrow { stroke: #5e60ce; stroke-width: 2; marker-end: url(#arrowhead); }
    .conv { fill: #bbdefb; stroke: #1976d2; }
    .pool { fill: #c8e6c9; stroke: #388e3c; }
    .fc { fill: #ffccbc; stroke: #e64a19; }
    .label { font: 12px sans-serif; fill: #555; }
  </style>
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" 
            refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#5e60ce"/>
    </marker>
  </defs>

  <!-- Input Image -->
  <rect x="40" y="150" width="80" height="80" fill="#eeeeee" stroke="#999"/>
  <text x="80" y="270" class="layer">输入图像</text>

  <!-- Conv Layer 1 -->
  <rect x="150" y="120" width="60" height="60" class="conv"/>
  <rect x="150" y="190" width="60" height="60" class="conv"/>
  <text x="180" y="265" class="layer">
    <tspan x="180" dy="0">Conv1</tspan>
    <tspan x="180" dy="18">自动提取边缘</tspan>
  </text>

  <!-- Pooling -->
  <rect x="250" y="140" width="40" height="40" class="pool"/>
  <rect x="250" y="200" width="40" height="40" class="pool"/>
  <text x="270" y="265" class="layer">
    <tspan x="270" dy="0">Pooling</tspan>
    <tspan x="270" dy="18">降维</tspan>
  </text>

  <!-- Conv Layer 2 -->
  <rect x="320" y="110" width="50" height="50" class="conv"/>
  <rect x="320" y="170" width="50" height="50" class="conv"/>
  <rect x="320" y="230" width="50" height="50" class="conv"/>
  <text x="345" y="285" class="layer">
    <tspan x="345" dy="0">Conv2</tspan>
    <tspan x="345" dy="18">组合部件</tspan>
  </text>

  <!-- Fully Connected -->
  <rect x="420" y="160" width="100" height="60" class="fc"/>
  <text x="470" y="195" text-anchor="middle" font-weight="bold" fill="#e64a19">分类头</text>
  <text x="470" y="215" text-anchor="middle" font-size="12" fill="#555">Softmax → 猫/狗</text>

  <!-- Arrows -->
  <line x1="120" y1="190" x2="150" y2="150" class="arrow"/>
  <line x1="210" y1="150" x2="250" y2="160" class="arrow"/>
  <line x1="290" y1="160" x2="320" y2="135" class="arrow"/>
  <line x1="370" y1="135" x2="420" y2="190" class="arrow"/>

  <text x="300" y="350" text-anchor="middle" class="label">
    CNN：端到端自动学习特征，无需人工设计
  </text>
  <text x="300" y="370" text-anchor="middle" font-size="12" fill="#666">
    但输出仍是离散类别（如“猫”或“狗”）
  </text>
</svg>
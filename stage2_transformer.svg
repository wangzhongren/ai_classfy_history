<svg width="600" height="400" xmlns="http://www.w3.org/2000/svg" style="background:#f9f9ff;border:1px solid #ddd;border-radius:8px;padding:20px;">
  <style>
    .token { font: 13px sans-serif; fill: #333; text-anchor: middle; }
    .embedding { fill: #e3f2fd; stroke: #1976d2; }
    .self-att { fill: #f3e5f5; stroke: #7b1fa2; }
    .ffn { fill: #e8f5e8; stroke: #388e3c; }
    .arrow { stroke: #5e60ce; stroke-width: 1.8; marker-end: url(#arrowhead); }
    .label { font: 12px sans-serif; fill: #555; }
  </style>
  <defs>
    <marker id="arrowhead" markerWidth="8" markerHeight="6" 
            refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#5e60ce"/>
    </marker>
  </defs>

  <!-- Input Tokens -->
  <rect x="50" y="60" width="60" height="30" class="embedding"/>
  <text x="80" y="80" class="token">[CLS]</text>
  
  <rect x="50" y="110" width="60" height="30" class="embedding"/>
  <text x="80" y="130" class="token">猫</text>
  
  <rect x="50" y="160" width="60" height="30" class="embedding"/>
  <text x="80" y="180" class="token">坐</text>
  
  <rect x="50" y="210" width="60" height="30" class="embedding"/>
  <text x="80" y="230" class="token">垫子</text>
  
  <rect x="50" y="260" width="60" height="30" class="embedding"/>
  <text x="80" y="280" class="token">[SEP]</text>

  <!-- Self-Attention Block -->
  <rect x="150" y="60" width="100" height="230" class="self-att" rx="8"/>
  <text x="200" y="170" text-anchor="middle" font-weight="bold" fill="#7b1fa2">自注意力</text>
  <text x="200" y="190" text-anchor="middle" font-size="11" fill="#555">计算 token 间关系</text>

  <!-- FFN Block -->
  <rect x="280" y="60" width="100" height="230" class="ffn" rx="8"/>
  <text x="330" y="170" text-anchor="middle" font-weight="bold" fill="#388e3c">前馈网络</text>
  <text x="330" y="190" text-anchor="middle" font-size="11" fill="#555">非线性变换</text>

  <!-- Output Embeddings (simplified) -->
  <rect x="410" y="150" width="120" height="40" fill="#ffe0b2" stroke="#ef6c00" rx="6"/>
  <text x="470" y="175" text-anchor="middle" font-weight="bold" fill="#e65100">语义向量</text>

  <!-- Arrows -->
  <line x1="110" y1="75" x2="150" y2="75" class="arrow"/>
  <line x1="110" y1="125" x2="150" y2="125" class="arrow"/>
  <line x1="110" y1="175" x2="150" y2="175" class="arrow"/>
  <line x1="110" y1="225" x2="150" y2="225" class="arrow"/>
  <line x1="110" y1="275" x2="150" y2="275" class="arrow"/>

  <line x1="250" y1="175" x2="280" y2="175" class="arrow"/>
  <line x1="380" y1="175" x2="410" y2="170" class="arrow"/>

  <!-- Attention visualization (conceptual lines) -->
  <line x1="200" y1="75" x2="200" y2="275" stroke="#7b1fa2" stroke-width="0.8" stroke-dasharray="3,3"/>
  <line x1="200" y1="125" x2="200" y2="225" stroke="#7b1fa2" stroke-width="0.8" stroke-dasharray="3,3"/>

  <text x="300" y="350" text-anchor="middle" class="label">
    Transformer：通过自注意力构建全局语义表示
  </text>
  <text x="300" y="370" text-anchor="middle" font-size="12" fill="#666">
    但仍需预定义类别，无法动态生成新类别
  </text>
</svg>